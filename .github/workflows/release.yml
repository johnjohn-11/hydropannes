name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Verify manifest version
        run: |
          MANIFEST_VERSION=$(python -c "import json; print(json.load(open('custom_components/hydropannes/manifest.json'))['version'])")
          TAG_VERSION="${{ steps.version.outputs.version }}"
          if [[ "$MANIFEST_VERSION" != "$TAG_VERSION" ]]; then
            echo "❌ Version mismatch: manifest.json ($MANIFEST_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version match: $TAG_VERSION"

      - name: Create release zip
        run: |
          cd custom_components
          zip -r ../hydropannes-${{ steps.version.outputs.version }}.zip hydropannes

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: hydropannes-${{ steps.version.outputs.version }}.zip
