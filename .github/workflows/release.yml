name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Generate changelog from commits
        id: changelog
        run: |
          REPO="${{ github.repository }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -v "^${{ github.ref_name }}$" | head -n1)

          if [ -z "$PREVIOUS_TAG" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREVIOUS_TAG}..HEAD"
          fi

          BODY=""
          while IFS='|' read -r SHORT_HASH MSG AUTHOR; do
            BODY="${BODY}* __[${SHORT_HASH}](https://github.com/${REPO}/commit/${SHORT_HASH})__ ${MSG} — _${AUTHOR}_\n"
          done <<< "$(git log --pretty=format:"%h|%s|%an" ${RANGE})"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          printf "%b" "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Install just
        uses: extractions/setup-just@v4.0.0

      - name: Bump version in all files
        run: just bump ${{ steps.version.outputs.version }}

      - name: Verify versions are in sync
        run: |
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/hydropannes/manifest.json'))['version'])")
          TAG="${{ steps.version.outputs.version }}"
          if [[ "$MANIFEST" != "$TAG" ]]; then
            echo "❌ Version mismatch after bump: manifest.json ($MANIFEST) != tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $TAG applied successfully"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/hydropannes/manifest.json pyproject.toml
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Create release zip
        run: |
          cd custom_components/hydropannes
          zip -r ../../hydropannes.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v3.0.0
        with:
          files: hydropannes.zip
          body: ${{ steps.changelog.outputs.body }}
