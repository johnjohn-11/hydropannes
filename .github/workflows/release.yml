name: Release

on:
  release:
    types:
      - published

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install just
        uses: extractions/setup-just@v2.0.0

      - name: Bump version in all files
        run: just bump ${{ steps.version.outputs.version }}

      - name: Verify versions are in sync
        run: |
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/hydropannes/manifest.json'))['version'])")
          TAG="${{ steps.version.outputs.version }}"
          if [[ "$MANIFEST" != "$TAG" ]]; then
            echo "❌ Version mismatch after bump: manifest.json ($MANIFEST) != tag ($TAG)"
            exit 1
          fi
          echo "✅ Version $TAG applied successfully"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add custom_components/hydropannes/manifest.json pyproject.toml
          git diff --staged --quiet || git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:${{ github.event.repository.default_branch }}

      - name: Create release zip
        run: |
          cd custom_components
          zip -r ../hydropannes.zip hydropannes

      - name: Upload release asset
        uses: softprops/action-gh-release@v2.2.1
        with:
          files: hydropannes.zip
          generate_release_notes: true
