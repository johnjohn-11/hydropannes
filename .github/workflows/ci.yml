name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
      - name: Install ruff
        run: pip install ruff
      - name: Run ruff check
        run: ruff check custom_components/hydropannes
      - name: Run ruff format check
        run: ruff format --check custom_components/hydropannes
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install mypy homeassistant==2025.4.0
      - name: Run mypy
        run: mypy custom_components/hydropannes --ignore-missing-imports
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Validate JSON files
        run: |
          python -m json.tool custom_components/hydropannes/manifest.json > /dev/null
          echo "✅ manifest.json is valid"
      - name: Check version sync
        run: |
          MANIFEST=$(python -c "import json; print(json.load(open('custom_components/hydropannes/manifest.json'))['version'])")
          PYPROJECT=$(python -c "import re,sys; m=re.search(r'version = .(.+).', open('pyproject.toml').read()); print(m.group(1))")
          if [[ "$MANIFEST" != "$PYPROJECT" ]]; then
            echo "❌ Version mismatch: manifest.json ($MANIFEST) != pyproject.toml ($PYPROJECT)"
            echo "Run: just bump <version>"
            exit 1
          fi
          echo "✅ Versions are in sync: $MANIFEST"
      - name: Check required files
        run: |
          files=(
            "custom_components/hydropannes/__init__.py"
            "custom_components/hydropannes/manifest.json"
            "custom_components/hydropannes/const.py"
            "custom_components/hydropannes/coordinator.py"
            "custom_components/hydropannes/sensor.py"
            "custom_components/hydropannes/binary_sensor.py"
            "custom_components/hydropannes/config_flow.py"
          )
          for file in "${files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "✅ $file exists"
            else
              echo "❌ $file is missing"
              exit 1
            fi
          done
  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
